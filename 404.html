<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>404 — page not found</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />

<style>
  :root{ --bg:#17181b; --ink:#b9bcc2; --muted:#7f858e; --accent:#35c0b4; --faint:#5b626f;
    --sans:'Inter', system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{ background:var(--bg); color:var(--ink); font-family:var(--sans);
    display:flex; align-items:center; justify-content:center; min-height:100vh; min-height:100svh;
    padding:2rem; text-align:left; -webkit-font-smoothing:antialiased; }
  .box{ max-width:34rem; }
  .code{ font-family:var(--mono); font-size:clamp(3.5rem,16vw,6rem); font-weight:700;
    line-height:1; letter-spacing:-.03em; margin:0; color:var(--ink); }
  .code b{ color:var(--accent); font-weight:700; }
  p{ font-size:1.05rem; color:var(--muted); line-height:1.6; margin:1.4rem 0 2rem; max-width:32ch; }
  a.home{ font-family:var(--mono); font-size:0.95rem; color:var(--accent); text-decoration:none;
    border-bottom:1px solid color-mix(in oklab, var(--accent) 40%, transparent); }
  a.home:hover{ color:#fff; }
  .kao{ font-family:var(--mono); font-size:0.8rem; color:var(--faint); margin-top:2.5rem; }
</style>
</head>

<body>
<main class="box">
  <h1 class="code">4<b>0</b>4</h1>
  <p>This page wandered off — probably somewhere between Barcelona and Berlin. Happens to the best of us.</p>
  <a class="home" href="/">← back home</a>
  <div class="kao" aria-hidden="true">｡◕‿◕｡</div>
</main>
</body>
</html>
